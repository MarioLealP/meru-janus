[project]
name = "janus"
version = "0.1.0"
description = "Meru's front door - takes requests from the atlas and agents, hands approvals to Xolotl"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sentry-sdk>=2.74.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
janus = "janus.cli:main" # the command line (D94): uv tool install git+ssh://git@git.clockmost.com/Meru/janus.git

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "types-pyyaml>=6.0.12.20261030",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "Q", "C4", "FAST", "N", "PT", "ERA", "D", "complex-structure", "S"]
ignore = [
    "undocumented-public-init",
    # From S, the rules that guess from a name or an import: on Meru's code they only raised false alarms.
    "assert",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-string",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "unused-async"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Unlike the template: janus has async tests, and these two make pytest-asyncio run them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
extra-paths = ["src"]
