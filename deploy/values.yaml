# janus's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: janus
owner: mario
image:
  repository: zot.clockmost.com/meru/janus
  digest: sha256:f8212b382878bacfd4dd3a1703fcdabfb1b70644f8d363719497ebc2029b592b
  tag: "be50f281bdeb"
# Its Gitea bot's token (meru-janus-identities.sh -> apps/meru/janus/eso/gitea): read on Meru/requests, enough to
# open AGit PRs there (D93). Without it Janus answers 503 on submit and only lists.
secretEnv:
  JANUS_GITEA_TOKEN:
    secret: gitea
    key: token
externalSecrets:
  gitea: {}
# Its own OpenBao login (D99, meru-janus-identities.sh step 3): create-only on apps/meru/<app>/eso/env, for a new
# app's secret values. Without the role it takes no secret values; requests without secrets work as before.
openbaoLogin:
  enabled: true
# Who may connect (D97): the host side - Caddy, Gitea and Zabbix are still Docker containers, so their addresses,
# plus the node for the kubelet's probes - the atlas UI reaches Janus through Caddy, never in-cluster. Everything else in the cluster is refused. When Caddy and Gitea move
# into the cluster (D24) the Docker range goes for their namespaces.
networkPolicy:
  enabled: true
  fromNamespaces: []

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://61c3d3e46939489797f58a7319c15045@glitchtip.clockmost.com/8
