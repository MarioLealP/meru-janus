# This app's CI on Meru's runner (Sindri, namespace <app>-build: each job is its own pod). No credentials anywhere
# here. Managed by Meru/nuwa-base (copier): change it there and tag it, Renovate opens the update PR in every app.
# checks: every check scripts/check.sh runs locally - lint, format, types, lockfile, tests.
# build: proves the image builds (BuildKit, nothing pushed) - on pull requests and main alike.
# Releasing is not CI's job: meru-release builds main again in a pod spec this repo can't change, scans it, pushes,
# signs with the app's key and commits the digest (Meru/meru-release). Pull requests never reach a key.
name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: [deploy/**]
  workflow_dispatch:

jobs:
  checks:
    if: gitea.repository != 'Meru/nuwa-python'
    runs-on: sindri-check # python 3.15 + uv + git (see the runner's labels)
    env:
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_PYTHON_DOWNLOADS: never # the image's python only
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD" # the workspace volume isn't owned by the job's user
          git init --quiet .
          git remote add origin "https://sindri:${{ gitea.token }}@git.clockmost.com/${{ gitea.repository }}.git"
          git fetch --quiet --depth 1 origin "${{ gitea.ref }}" # a PR's commit lives under refs/pull/<n>/...
          git checkout --quiet -B work FETCH_HEAD

      - name: checks
        run: |
          uv sync --frozen
          scripts/check.sh

  build:
    needs: checks
    runs-on: sindri
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init --quiet .
          git remote add origin "https://sindri:${{ gitea.token }}@git.clockmost.com/${{ gitea.repository }}.git"
          git fetch --quiet --depth 1 origin "${{ gitea.ref }}" # a PR's commit lives under refs/pull/<n>/...
          git checkout --quiet -B work FETCH_HEAD

      - name: build
        run: scripts/build.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=.
